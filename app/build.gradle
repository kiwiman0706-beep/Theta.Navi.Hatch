plugins { id 'com.android.application' }
android {
 namespace 'app.thetahatch.navi'
 compileSdk 36
 defaultConfig {
  applicationId 'app.thetahatch.navi'
  minSdk 26
  targetSdk 36
  versionCode 5
  versionName '0.3.1'
 }
 // シリーズ共通鍵（Theta.Hatch.Series の secrets/README.md）。CI は Secret 4 つ、手元は同じ名前の環境変数。
 // 鍵が無いときの release は未署名（debug は Android の既定の debug 鍵）。
 def ks = System.getenv('ANDROID_KEYSTORE_FILE')
 signingConfigs {
  if (ks) { theta { storeFile file(ks); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'thetahatch'; keyPassword System.getenv('ANDROID_KEY_PASSWORD') } }
 }
 buildTypes {
  // Play（内部テスト）は debuggable を受け付けないので 0.3.1 から外す。診断ファイルは adb の cmd export で外部の files/export へ書き出して回収する
  release { if (ks) signingConfig signingConfigs.theta; minifyEnabled false; debuggable false }
 }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' } }
}
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.0')
 implementation 'com.google.android.libraries.navigation:navigation:7.9.0'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
 implementation 'androidx.car.app:app:1.7.0'
 implementation 'androidx.car.app:app-projected:1.7.0'
 implementation 'androidx.activity:activity:1.9.3'
 testImplementation 'androidx.car.app:app-testing:1.7.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
